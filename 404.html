<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — страница не найдена | Павел Филатов</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page{min-height:100svh;display:grid;place-items:center;padding:40px 0;text-align:center}
    .error-page h1{font-family:var(--font-display);font-size:clamp(80px,18vw,190px);line-height:.85;letter-spacing:-.08em;color:var(--accent);margin:0}
    .error-page p{max-width:38ch;margin:24px auto 30px;color:var(--text-dim)}
    .error-page .btn{width:auto}
  </style>
</head>
<body>
  <main class="error-page">
    <div class="container">
      <p class="eyebrow" style="justify-content:center"><span class="pulse" aria-hidden="true"></span> 404</p>
      <h1>Страница ушла</h1>
      <p>Похоже, этой страницы нет. Вернитесь на главную — там проекты, контакты и форма для сообщения.</p>
      <a class="btn btn-primary" href="index.html">На главную <span aria-hidden="true">↗</span></a>
    </div>
  </main>
</body>
</html>
